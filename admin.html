<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Qanunvericilik Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b132b]">

  <!-- ADMIN SPECIFIC HEADER -->
  <header class="bg-[#1c2541] border-b border-gray-800 py-4 px-6 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-[#d4af37] text-[#0b132b] font-bold flex items-center justify-center text-sm">ADM</div>
        <div>
          <h1 class="text-sm font-bold text-white">İDARƏETMƏ PANELİ</h1>
          <p class="text-[10px] text-gray-400">Yunis İmanov Control Center</p>
        </div>
      </div>
      <div class="flex items-center space-x-4 text-xs">
        <a href="index.html" class="text-gray-400 hover:text-white"><i class="fa-solid fa-globe mr-1"></i> Sayta Keç</a>
        <button class="px-3 py-1.5 bg-red-500/10 text-red-400 rounded-lg border border-red-500/20">Çıxış</button>
      </div>
    </div>
  </header>

  <!-- ADMIN DASHBOARD CONTENT -->
  <main class="max-w-7xl mx-auto p-6 my-6 grid md:grid-cols-3 gap-6">
    
    <!-- Sual Əlavə Etmə Formu -->
    <div class="bg-[#1c2541] border border-gray-800 rounded-2xl p-6 md:col-span-1">
      <h3 class="text-base font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-plus-circle text-[#d4af37] mr-2"></i> Yeni Sual Əlavə Et
      </h3>
      <form class="space-y-4 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">Kategoriya / Qrup</label>
          <select class="w-full bg-[#0b132b] border border-gray-700 rounded-lg p-2.5 text-white">
            <option>BB Qrupu</option>
            <option>BA Qrupu</option>
            <option>AC Qrupu</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Sualın Mətni</label>
          <textarea rows="3" class="w-full bg-[#0b132b] border border-gray-700 rounded-lg p-2.5 text-white placeholder-gray-600" placeholder="Sualı bura yazın..."></textarea>
        </div>
        <button type="button" class="gold-btn w-full py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider">Bazaya Əlavə Et</button>
      </form>
    </div>

    <!-- Nəticələr və Statistika Cədvəli -->
    <div class="bg-[#1c2541] border border-gray-800 rounded-2xl p-6 md:col-span-2">
      <h3 class="text-base font-bold text-white mb-4 flex items-center justify-between">
        <span><i class="fa-solid fa-list-check text-[#d4af37] mr-2"></i> Son İmtahan Nəticələri</span>
        <span class="text-xs font-normal text-gray-400">Ümumi: 128 Tələbə</span>
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-300">
          <thead class="bg-[#0b132b] text-gray-400 uppercase text-[10px]">
            <tr>
              <th class="p-3">Tələbə</th>
              <th class="p-3">Qrup</th>
              <th class="p-3">Nəticə</th>
              <th class="p-3">Tarix</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-800">
            <tr>
              <td class="p-3 font-semibold text-white">Aysel Məmmədova</td>
              <td class="p-3">BB1</td>
              <td class="p-3 text-green-400 font-bold">88% (35/40)</td>
              <td class="p-3 text-gray-500">Bu gün, 14:10</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

</body>
</html>
